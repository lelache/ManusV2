name: CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Supprimer tout pnpm-workspace.yaml résiduel
      - name: Clean rogue pnpm workspace file
        run: |
          echo "Removing pnpm-workspace.yaml if exists"
          rm -f pnpm-workspace.yaml

      # Ensurer qu'on est dans frontend pour les étapes suivantes
      - name: Show workspace contents
        working-directory: frontend
        run: |
          pwd
          ls -la
          test -f pnpm-lock.yaml && echo "pnpm-lock.yaml OK" || (echo "pnpm-lock.yaml MISSING" && exit 1)

      - name: Install dependencies in frontend
        working-directory: frontend
        run: pnpm install

      - name: Lint
        working-directory: frontend
        run: pnpm lint || echo "Lint skipped"

      - name: Build
        working-directory: frontend
        run: pnpm build
