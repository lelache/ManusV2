name: CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # IMPORTANT: s'assurer qu'il n'y a PAS de workspace à la racine
      - name: Ensure no pnpm workspace at repo root
        run: rm -f pnpm-workspace.yaml

      # On bascule ensuite dans frontend pour tout le reste
      - name: Show workspace
        working-directory: frontend
        run: |
          pwd
          ls -la
          test -f pnpm-lock.yaml && echo "pnpm-lock.yaml OK" || (echo "pnpm-lock.yaml MISSING" && exit 1)

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Lint
        working-directory: frontend
        run: pnpm lint || echo "Lint skipped (no config yet)"

      - name: Build
        working-directory: frontend
        env:
          NODE_ENV: production
        run: pnpm build
